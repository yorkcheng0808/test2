<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓麥塊 (Cat Minecraft 3D)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft JhengHei', sans-serif;
            user-select: none;
            background-color: #111;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* 準心 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            line-height: 10px;
        }
        /* 介面提示與說明 */
        #ui-instruction {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.5;
        }
        /* 下方快捷欄 */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            border-radius: 8px;
            gap: 5px;
        }
        .slot {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            position: relative;
        }
        .slot.selected {
            border-color: #ffcc00;
            background: rgba(255, 204, 0, 0.2);
        }
        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #fff;
        }
        /* 製作台介面 */
        #crafting-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            border: 3px solid #666;
            border-radius: 10px;
            padding: 20px;
            color: white;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        #crafting-panel h3 {
            margin-top: 0;
            color: #ffcc00;
        }
        .crafting-grid {
            display: grid;
            grid-template-columns: repeat(2, 50px);
            gap: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="ui-instruction">
        <b>🐾 貓麥塊 (Cat Minecraft) 3D</b><br>
        • <b>WASD</b>: 移動<br>
        • <b>空白鍵 (Space)</b>: 跳躍<br>
        • <b>滑鼠左鍵點擊</b>: 鎖定視角 / 挖掘方塊<br>
        • <b>滑鼠右鍵點擊</b>: 放置方塊 / 互動<br>
        • <b>數字鍵 1-5</b>: 切換方塊類型<br>
        • <b>ESC</b>: 解除視角鎖定
    </div>

    <div id="hotbar">
        <div class="slot selected" onclick="selectSlot(0)">草皮<div class="slot-count" id="count-0">64</div></div>
        <div class="slot" onclick="selectSlot(1)">泥土<div class="slot-count" id="count-1">64</div></div>
        <div class="slot" onclick="selectSlot(2)">石頭<div class="slot-count" id="count-2">64</div></div>
        <div class="slot" onclick="selectSlot(3)">木頭<div class="slot-count" id="count-3">64</div></div>
        <div class="slot" onclick="selectSlot(4)">貓薄荷石<div class="slot-count" id="count-4">64</div></div>
    </div>

    <div id="canvas-container"></div>

    <!-- 載入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let blocks = {}; // 儲存方塊位置與類型
        let raycaster, mouse;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        // 玩家狀態
        const player = {
            height: 1.6,
            speed: 10.0,
            jumpSpeed: 12.0
        };

        // 物品欄數量
        const inventory = [64, 64, 64, 64, 64];
        let selectedSlot = 0;

        // 方塊材質定義 (顏色與名稱)
        const blockTypes = [
            { id: 1, name: '草皮', color: 0x559933, topColor: 0x77cc44 },
            { id: 2, name: '泥土', color: 0x8b5a2b },
            { id: 3, name: '石頭', color: 0x888888 },
            { id: 4, name: '木頭', color: 0x5c4033 },
            { id: 5, name: '貓薄荷石', color: 0x9966cc }
        ];

        let blockMaterials = [];

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. 場景設定
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xcce0ff);
            scene.fog = new THREE.FogExp2(0xcce0ff, 0.015);

            // 2. 相機設定
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // 3. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. 光照
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 100, 50);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // 5. 初始化方塊材質
            blockMaterials = blockTypes.map(type => {
                if (type.topColor) {
                    return [
                        new THREE.MeshLambertMaterial({ color: type.color }),
                        new THREE.MeshLambertMaterial({ color: type.color }),
                        new THREE.MeshLambertMaterial({ color: type.topColor }),
                        new THREE.MeshLambertMaterial({ color: type.color }),
                        new THREE.MeshLambertMaterial({ color: type.color }),
                        new THREE.MeshLambertMaterial({ color: type.color })
                    ];
                } else {
                    return new THREE.MeshLambertMaterial({ color: type.color });
                }
            });

            // 6. 產生初始世界 (平坦草地與簡單地形)
            generateWorld();

            // 7. 射線與滑鼠控制
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2(0, 0);

            setupControls();

            // 視窗縮放事件
            window.addEventListener('resize', onWindowResize);
        }

        // 產生世界地圖
        const blockSize = 1;
        const worldSize = 16;

        function generateWorld() {
            const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);

            for (let x = -worldSize; x < worldSize; x++) {
                for (let z = -worldSize; z < worldSize; z++) {
                    // 地面底層 (石頭)
                    createBlock(x, -2, z, 3, geometry);
                    createBlock(x, -1, z, 2, geometry);
                    // 頂層草地
                    createBlock(x, 0, z, 1, geometry);

                    // 隨機生成一些樹木或小山丘
                    if (Math.abs(x) + Math.abs(z) > 5 && Math.random() < 0.05) {
                        let h = Math.floor(Math.random() * 3) + 1;
                        for (let y = 1; y <= h; y++) {
                            createBlock(x, y, z, 4, geometry);
                        }
                    }
                }
            }
        }

        function createBlock(x, y, z, typeId, geometry) {
            const key = `${x},${y},${z}`;
            if (blocks[key]) return;

            const material = blockMaterials[typeId - 1];
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            blocks[key] = { mesh: mesh, type: typeId };
        }

        function removeBlock(key) {
            if (blocks[key]) {
                scene.remove(blocks[key].mesh);
                delete blocks[key];
            }
        }

        // 控制系統 (PointerLock 視角與鍵盤移動)
        let isLocked = false;
        const Euler = new THREE.Euler(0, 0, 0, 'YXZ');

        function setupControls() {
            const canvas = renderer.domElement;

            canvas.addEventListener('click', () => {
                if (!isLocked) {
                    canvas.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === canvas;
            });

            document.addEventListener('mousemove', (event) => {
                if (!isLocked) return;

                const movementX = event.movementX || event.moouseX || 0;
                const movementY = event.movementY || event.moouseY || 0;

                Euler.setFromQuaternion(camera.quaternion);
                Euler.y -= movementX * 0.002;
                Euler.x -= movementY * 0.002;
                Euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, Euler.x));
                camera.quaternion.setFromEuler(Euler);
            });

            // 鍵盤事件
            document.addEventListener('keydown', (e) => handleKeyEvent(e, true));
            document.addEventListener('keyup', (e) => handleKeyEvent(e, false));

            // 滑鼠點擊挖掘與放置
            window.addEventListener('mousedown', (e) => {
                if (!isLocked) return;

                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(scene.children);

                if (intersects.length > 0) {
                    const intersect = intersects[0];

                    if (intersect.distance < 8) { // 互動距離
                        if (e.button === 0) {
                            // 左鍵：挖掘方塊
                            const pos = intersect.object.position;
                            const key = `${Math.round(pos.x)},${Math.round(pos.y)},${Math.round(pos.z)}`;
                            removeBlock(key);
                            inventory[selectedSlot]++;
                            updateInventoryUI();
                        } else if (e.button === 2) {
                            // 右鍵：放置方塊
                            if (inventory[selectedSlot] > 0) {
                                const position = new THREE.Vector3().copy(intersect.point).add(intersect.face.normal.clone().multiplyScalar(0.5));
                                const x = Math.round(position.x);
                                const y = Math.round(position.y);
                                const z = Math.round(position.z);

                                const key = `${x},${y},${z}`;
                                if (!blocks[key]) {
                                    createBlock(x, y, z, selectedSlot + 1, new THREE.BoxGeometry(1, 1, 1));
                                    inventory[selectedSlot]--;
                                    updateInventoryUI();
                                }
                            }
                        }
                    }
                }
            });

            // 阻止右鍵選單
            window.addEventListener('contextmenu', e => e.preventDefault());

            // 數字鍵切換道具欄
            window.addEventListener('keydown', (e) => {
                if (e.key >= '1' && e.key <= '5') {
                    selectSlot(parseInt(e.key) - 1);
                }
            });
        }

        function handleKeyEvent(e, isDown) {
            switch (e.code) {
                case 'KeyW': moveForward = isDown; break;
                case 'KeyS': moveBackward = isDown; break;
                case 'KeyA': moveLeft = isDown; break;
                case 'KeyD': moveRight = isDown; break;
                case 'Space':
                    if (isDown && canJump) {
                        velocity.y += player.jumpSpeed;
                        canJump = false;
                    }
                    break;
            }
        }

        function selectSlot(index) {
            selectedSlot = index;
            document.querySelectorAll('.slot').forEach((el, idx) => {
                if (idx === index) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
        }

        function updateInventoryUI() {
            for (let i = 0; i < inventory.length; i++) {
                document.getElementById(`count-${i}`).innerText = inventory[i];
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 遊戲主迴圈
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 4.0 * delta; // 重力

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * player.speed * delta * 10;
                if (moveLeft || moveRight) velocity.x -= direction.x * player.speed * delta * 10;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.y > 0 ? 0 : 0); // 簡易移動簡化
                
                // 簡易上下左右移動
                const actualMoveX = -velocity.x * delta;
                const actualMoveZ = -velocity.z * delta;
                camera.position.x += actualMoveX * Math.cos(Euler.y) - actualMoveZ * Math.sin(Euler.y);
                camera.position.z += actualMoveZ * Math.cos(Euler.y) + actualMoveX * Math.sin(Euler.y);

                camera.position.y += (velocity.y * delta);

                // 地面碰撞檢測 (簡單版)
                if (camera.position.y < 2.5) {
                    velocity.y = 0;
                    camera.position.y = 2.5;
                    canJump = true;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
