<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 飛機破碎模擬器 (Pro Controller)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        #hud { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.5); padding: 15px; border: 1px solid #0f0; }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.5); padding: 15px; }
        .red { color: #f00; } .green { color: #0f0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="info">
    <h1>Flight Sim (Switch Pro Control)</h1>
    <p id="controller-status" class="red">未偵測到手把 (請按下按鍵)</p>
    <p>控制: 左搖桿(油門/偏航), 右搖桿(俯仰/滾轉), B鍵(重生)</p>
</div>
<div id="hud">
    <div>速度: <span id="v-speed">0</span></div>
    <div>高度: <span id="v-alt">0</span></div>
</div>

<script>
    // --- 場景設定 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

    // --- 飛機模型 ---
    const airplane = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 10), new THREE.MeshPhongMaterial({color: 0x0000ff}));
    body.rotation.z = Math.PI/2;
    airplane.add(body);
    scene.add(airplane);

    // --- 地面 ---
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshPhongMaterial({color: 0x228b22}));
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // --- 破碎函數 ---
    function crash(obj) {
        if(isCrashed) return;
        isCrashed = true;
        scene.remove(obj);
        
        // 簡單碎片化：建立幾個隨機方塊代表機體殘骸
        for(let i=0; i<10; i++) {
            const frag = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshPhongMaterial({color: 0xff0000}));
            frag.position.copy(obj.position);
            frag.userData = { vel: new THREE.Vector3(Math.random()-0.5, Math.random(), Math.random()-0.5).multiplyScalar(5) };
            fragments.push(frag);
            scene.add(frag);
        }
    }

    // --- 變數 ---
    let speed = 0, throttle = 0, isCrashed = false, fragments = [];
    camera.position.set(0, 10, 20);

    // --- 動畫迴圈 ---
    function animate() {
        requestAnimationFrame(animate);
        
        const gp = navigator.getGamepads()[0];
        if(gp) {
            document.getElementById('controller-status').innerText = "手把已連接: " + gp.id;
            document.getElementById('controller-status').className = "green";
            
            // 讀取手把輸入
            throttle = (1 - gp.axes[1]) * 0.5; // 左搖桿Y
            airplane.rotateX(gp.axes[3] * 0.05); // 右搖桿Y
            airplane.rotateZ(-gp.axes[2] * 0.05); // 右搖桿X
            
            if(gp.buttons[0].pressed) location.reload(); // B鍵重置
        }

        if(!isCrashed) {
            speed = throttle * 2;
            airplane.translateZ(speed);
            
            // 碰撞檢測
            if(airplane.position.y < 0) crash(airplane);
            
            camera.position.lerp(airplane.position.clone().add(new THREE.Vector3(0, 5, 15)), 0.1);
            camera.lookAt(airplane.position);
        } else {
            fragments.forEach(f => f.position.add(f.userData.vel));
        }

        document.getElementById('v-speed').innerText = (speed * 100).toFixed(0);
        document.getElementById('v-alt').innerText = airplane.position.y.toFixed(0);
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
