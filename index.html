<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>F-16 穩定版飛行模擬器</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        #hud, #nav-panel { position: absolute; background: rgba(0,0,0,0.6); border: 1px solid #444; padding: 10px; pointer-events: none; }
        #hud { top: 10px; left: 10px; width: 220px; }
        #nav-panel { bottom: 20px; left: 20px; width: 250px; }
        .val { color: #00ffcc; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">
    <div>速度: <span id="s" class="val">0</span> knots</div>
    <div>高度: <span id="a" class="val">0</span> ft</div>
    <div>油門: <span id="t" class="val">0</span>%</div>
</div>

<div id="nav-panel">
    <strong>GPS 導航 (目標機場)</strong><br>
    方位偏移: <span id="nav-dev" class="val">0</span> 度<br>
    距離: <span id="nav-dist" class="val">0</span> 公里
</div>

<script>
    // 場景設定
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 20000);
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 飛機
    const airplane = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 10), new THREE.MeshStandardMaterial({color: 0x555555}));
    airplane.add(body);
    scene.add(airplane);
    
    // 燈光
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    
    // 飛行物理變數
    let speed = 0, throttle = 0, pitch = 0, roll = 0, yaw = 0;
    const targetAirport = new THREE.Vector3(2000, 0, 2000);

    function animate() {
        requestAnimationFrame(animate);

        // 讀取手把
        const gp = navigator.getGamepads()[0];
        if(gp) {
            // 油門控制：鬆開搖桿歸零 (Throttle Idle)
            throttle = Math.abs(gp.axes[1]) > 0.1 ? THREE.MathUtils.clamp(-gp.axes[1], 0, 1) : 0;
            
            // 操控修正：降低靈敏度 (乘上 0.015) 避免亂翻
            pitch = -gp.axes[3] * 0.015;
            roll = -gp.axes[2] * 0.015;
            yaw = -gp.axes[0] * 0.015;
        }

        // 速度與引擎物理
        speed = THREE.MathUtils.lerp(speed, throttle * 8, 0.02); // 加速與空氣阻力平滑
        
        // 飛行姿態
        airplane.rotateX(pitch);
        airplane.rotateZ(roll);
        airplane.rotateY(yaw);
        
        // 移動
        const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(airplane.quaternion);
        airplane.position.add(dir.multiplyScalar(speed));
        
        // 修正衝上天掉不下來的問題：增加重力影響與失速機制
        airplane.position.y -= 0.05; 
        if(airplane.position.y < 0) airplane.position.y = 0;

        // GPS 計算
        const dist = airplane.position.distanceTo(targetAirport) / 100;
        const dirToTarget = new THREE.Vector3().subVectors(targetAirport, airplane.position).normalize();
        const planeForward = new THREE.Vector3(0,0,1).applyQuaternion(airplane.quaternion);
        const angle = Math.round(planeForward.angleTo(dirToTarget) * 180 / Math.PI);

        // 更新 UI
        document.getElementById('s').innerText = Math.floor(speed * 100);
        document.getElementById('a').innerText = Math.floor(airplane.position.y * 10);
        document.getElementById('t').innerText = Math.floor(throttle * 100);
        document.getElementById('nav-dev').innerText = angle;
        document.getElementById('nav-dist').innerText = dist.toFixed(1);

        camera.position.copy(airplane.position).add(new THREE.Vector3(0, 2, 5));
        camera.lookAt(airplane.position);
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
