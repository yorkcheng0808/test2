<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F-16 第一人稱駕駛艙模擬器</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        #hud { position: absolute; bottom: 20px; left: 20px; background: rgba(0,20,40,0.75); padding: 15px 25px; border-radius: 8px; border: 1px solid #00ffcc; pointer-events: none; box-shadow: 0 0 15px rgba(0,255,204,0.3); }
        #hud div { margin: 5px 0; font-size: 15px; letter-spacing: 1px; }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px 20px; border-radius: 8px; border: 1px solid #555; }
        #info h2 { margin: 0 0 8px 0; font-size: 18px; color: #00ffcc; }
        #info p { margin: 4px 0; font-size: 13px; color: #ccc; }
        .red { color: #ff4444; font-weight: bold; } 
        .green { color: #00ffcc; font-weight: bold; }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="info">
    <h2>F-16 第一人稱駕駛艙模擬器</h2>
    <p id="controller-status" class="red">狀態: 等待手把連線 (請按任意按鍵)</p>
    <p><strong>控制說明：</strong></p>
    <p>• 左搖桿上下：油門動力控制</p>
    <p>• 左搖桿左右：偏航 (Yaw)</p>
    <p>• 右搖桿上下：俯仰 (Pitch)</p>
    <p>• 右搖桿左右：滾轉 (Roll)</p>
    <p>• B 鍵：損毀重置 (重生)</p>
</div>

<div id="hud">
    <div style="font-size: 18px; border-bottom: 1px dashed #00ffcc; padding-bottom: 5px; margin-bottom: 8px; color:#00ffcc;">COCKPIT HUD</div>
    <div>飛行速度: <span id="v-speed" style="color:#fff;">0</span> knots</div>
    <div>飛行高度: <span id="v-alt" style="color:#fff;">0</span> ft</div>
    <div>油門動力: <span id="v-throttle" style="color:#fff;">0</span>%</div>
</div>

<script>
    // --- 1. 場景與渲染器設定 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0c5e8);
    scene.fog = new THREE.FogExp2(0xa0c5e8, 0.0006);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 10000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 光照
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(500, 800, 500);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- 2. 環境：海浪與水泥跑道 ---
    const waterGeo = new THREE.PlaneGeometry(12000, 12000, 64, 64);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x1e6091, roughness: 0.1, metalness: 0.8 });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = -2;
    scene.add(water);

    const landGeo = new THREE.PlaneGeometry(6000, 12000);
    landGeo.rotateX(-Math.PI / 2);
    const landMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.9 });
    const land = new THREE.Mesh(landGeo, landMat);
    land.position.set(-4000, 0, 0);
    scene.add(land);

    const runwayGeo = new THREE.PlaneGeometry(90, 2500);
    runwayGeo.rotateX(-Math.PI / 2);
    const runwayMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
    const runway = new THREE.Mesh(runwayGeo, runwayMat);
    runway.position.set(-700, 0.61, 0);
    scene.add(runway);

    // --- 3. 更精緻的 F-16 戰鬥機模型（含副油箱、進氣道與武器） ---
    const airplane = new THREE.Group();
    const f16Mat = new THREE.MeshStandardMaterial({ color: 0x6e757c, roughness: 0.35, metalness: 0.65 });

    // 機身
    const fuselageGeo = new THREE.ConeGeometry(1.8, 18, 12);
    fuselageGeo.rotateX(Math.PI / 2);
    const fuselage = new THREE.Mesh(fuselageGeo, f16Mat);
    airplane.add(fuselage);

    // 主機翼
    const wingGeo = new THREE.BoxGeometry(25, 0.3, 5.5);
    const wings = new THREE.Mesh(wingGeo, f16Mat);
    wings.position.set(0, 0, -1);
    airplane.add(wings);

    // 垂直尾翼
    const tailGeo = new THREE.BoxGeometry(0.3, 5.5, 4.2);
    const tail = new THREE.Mesh(tailGeo, f16Mat);
    tail.position.set(0, 2.7, -7.5);
    tail.rotation.x = -0.3;
    airplane.add(tail);

    // F-16 機腹進氣道
    const intakeGeo = new THREE.BoxGeometry(2.2, 1.5, 6);
    const intake = new THREE.Mesh(intakeGeo, f16Mat);
    intake.position.set(0, -1.2, 2);
    airplane.add(intake);

    // 機翼下副油箱 (像圖片中的掛載)
    const tankGeo = new THREE.CylinderGeometry(0.5, 0.5, 5, 8);
    tankGeo.rotateX(Math.PI / 2);
    const tankMat = new THREE.MeshStandardMaterial({ color: 0x555a60, roughness: 0.4 });
    const leftTank = new THREE.Mesh(tankGeo, tankMat);
    leftTank.position.set(-5, -1.2, 0);
    airplane.add(leftTank);
    const rightTank = new THREE.Mesh(tankGeo, tankMat);
    rightTank.position.set(5, -1.2, 0);
    airplane.add(rightTank);

    // 翼尖飛彈
    const missileGeo = new THREE.CylinderGeometry(0.2, 0.2, 4, 8);
    missileGeo.rotateX(Math.PI / 2);
    const missileMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9 });
    const leftMissile = new THREE.Mesh(missileGeo, missileMat);
    leftMissile.position.set(-12.5, 0, -1);
    airplane.add(leftMissile);
    const rightMissile = new THREE.Mesh(missileGeo, missileMat);
    rightMissile.position.set(12.5, 0, -1);
    airplane.add(rightMissile);

    // 駕駛艙內部框架 (第一人稱視角會看到的座艙罩邊緣)
    const cockpitFrameGeo = new THREE.BoxGeometry(2, 0.1, 2);
    const cockpitFrame = new THREE.Mesh(cockpitFrameGeo, new THREE.MeshStandardMaterial({ color: 0x111111 }));
    cockpitFrame.position.set(0, 0.5, 1.5);
    airplane.add(cockpitFrame);

    // 降落輪子
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
    const strutMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
    function createWheel(x, z) {
        const group = new THREE.Group();
        const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.3), strutMat);
        strut.position.set(0, -0.65, 0);
        group.add(strut);
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.35, 12), wheelMat);
        wheel.rotateZ(Math.PI / 2);
        wheel.position.set(0, -1.3, 0);
        group.add(wheel);
        group.position.set(x, -0.5, z);
        return group;
    }
    airplane.add(createWheel(0, 4.5));
    airplane.add(createWheel(-2.6, -1));
    airplane.add(createWheel(2.6, -1));

    // 機尾噴射焰火
    const flameGeo = new THREE.ConeGeometry(0.9, 6, 10);
    flameGeo.rotateX(Math.PI / 2);
    const flameMat = new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.85 });
    const exhaustFlame = new THREE.Mesh(flameGeo, flameMat);
    exhaustFlame.position.set(0, 0, -11);
    airplane.add(exhaustFlame);

    airplane.position.set(-700, 1.25, -800);
    scene.add(airplane);

    // --- 4. 物理與破碎系統 ---
    let speed = 0, verticalVel = 0, throttle = 0;
    let isCrashed = false;
    let fragments = [];

    function triggerCrash() {
        if (isCrashed) return;
        isCrashed = true;
        scene.remove(airplane);

        for (let i = 0; i < 35; i++) {
            const size = Math.random() * 1.6 + 0.4;
            const frag = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), f16Mat);
            frag.position.copy(airplane.position);
            frag.userData = {
                velocity: new THREE.Vector3((Math.random() - 0.5) * 20, Math.random() * 18 + 2, (Math.random() - 0.5) * 20),
                rotSpeed: new THREE.Vector3(Math.random() * 15, Math.random() * 15, Math.random() * 15)
            };
            fragments.push(frag);
            scene.add(frag);
        }
    }

    function resetGame() {
        isCrashed = false;
        fragments.forEach(f => scene.remove(f));
        fragments = [];
        airplane.position.set(-700, 1.25, -800);
        airplane.rotation.set(0, 0, 0);
        speed = 0;
        verticalVel = 0;
        throttle = 0;
        scene.add(airplane);
    }

    // --- 5. 搖桿控制與主迴圈 ---
    let gamepadIndex = null;
    window.addEventListener("gamepadconnected", (e) => {
        gamepadIndex = e.gamepad.index;
        const statusEl = document.getElementById('controller-status');
        statusEl.innerText = "已連線: " + e.gamepad.id;
        statusEl.className = "green";
    });

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const time = clock.getElapsedTime();

        // 海浪動畫
        const pos = waterGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const u = pos.getX(i), v = pos.getY(i);
            pos.setZ(i, Math.sin(u * 0.01 + time * 2) * 2.5 + Math.cos(v * 0.01 + time * 1.5) * 2.5);
        }
        waterGeo.attributes.position.needsUpdate = true;

        if (gamepadIndex !== null) {
            const gp = navigator.getGamepads()[gamepadIndex];
            if (gp) {
                throttle = THREE.MathUtils.clamp(throttle + (-gp.axes[1] * 0.03), 0, 1);
                airplane.rotateY(-gp.axes[0] * 0.035);
                airplane.rotateX(-gp.axes[3] * 0.045);
                airplane.rotateZ(-gp.axes[2] * 0.045);
                if (gp.buttons[0] && gp.buttons[0].pressed) resetGame();
            }
        }

        if (!isCrashed) {
            const targetSpeed = throttle * 4.5;
            speed = THREE.MathUtils.lerp(speed, targetSpeed, 0.05);

            exhaustFlame.scale.set(0.8 + throttle * 0.6 + Math.random()*0.2, 0.8 + throttle * 0.6 + Math.random()*0.2, throttle * 1.8);
            flameMat.opacity = throttle > 0.05 ? 0.9 : 0.0;

            const forwardDir = new THREE.Vector3(0, 0, 1).applyQuaternion(airplane.quaternion);
            const lift = speed * 0.038; 
            const gravity = 0.04;
            verticalVel += (forwardDir.y * speed * 0.085 + lift - gravity) * 0.1;
            
            airplane.position.addScaledVector(forwardDir, speed);
            airplane.position.y += verticalVel;

            const terrainHeight = (airplane.position.x > -4000) ? 0.61 : -2;
            if (airplane.position.y <= terrainHeight) {
                if (terrainHeight === -2 || verticalVel < -0.25) {
                    triggerCrash();
                } else {
                    airplane.position.y = terrainHeight;
                    verticalVel = 0;
                    speed *= 0.985; // 跑道滑行減速，不爆炸
                }
            }

            // --- 第一人稱駕駛艙視角鏡頭設定 ---
            // 將相機直接放在飛機內部的駕駛艙位置 (略高於機身中心，朝向前方)
            const cockpitOffset = new THREE.Vector3(0, 1.4, 0.5).applyQuaternion(airplane.quaternion);
            camera.position.copy(airplane.position).add(cockpitOffset);

            // 相機鏡頭方向與飛機一致，並根據機頭朝向看出去
            const lookTarget = airplane.position.clone().add(new THREE.Vector3(0, 1.4, 20).applyQuaternion(airplane.quaternion));
            camera.quaternion.copy(airplane.quaternion);

        } else {
            // 墜毀碎片四散
            fragments.forEach(f => {
                f.position.add(f.userData.velocity);
                f.rotation.x += f.userData.rotSpeed.x * 0.02;
                f.rotation.y += f.userData.rotSpeed.y * 0.02;
                f.userData.velocity.y -= 0.35;
            });

            // 墜毀時相機停留在原地看著殘骸
            camera.position.lerp(airplane.position.clone().add(new THREE.Vector3(0, 10, -20)), 0.05);
            camera.lookAt(airplane.position);
        }

        document.getElementById('v-speed').innerText = Math.floor(speed * 120);
        document.getElementById('v-alt').innerText = Math.floor(Math.max(0, airplane.position.y) * 3.28);
        document.getElementById('v-throttle').innerText = Math.floor(throttle * 100);

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
