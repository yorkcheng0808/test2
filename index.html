<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 魔術方塊 - 智慧逐步還原模擬器</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: Arial, sans-serif; }
        #c { position: absolute; width: 100%; height: 100%; display: block; }
        
        /* UI 控制面板 */
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            color: white;
            width: 280px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10;
        }
        h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 10px; color: #4facfe; }
        .instr { font-size: 0.85rem; margin-bottom: 10px; color: #ccc; line-height: 1.4; }
        
        /* 按鈕樣式 */
        .action-btn {
            width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; transition: background 0.2s;
        }
        #btn-scramble { background-color: #f39c12; color: white; }
        #btn-scramble:hover { background-color: #d35400; }

        #btn-next-step { background-color: #2ecc71; color: white; }
        #btn-next-step:hover { background-color: #27ae60; }
        #btn-next-step:disabled { background-color: #7f8c8d; cursor: not-allowed; }

        #btn-reset { background-color: #e74c3c; color: white; }
        #btn-reset:hover { background-color: #c0392b; }

        /* 步驟說明框 */
        #step-log {
            background: #111;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #f1c40f;
            min-height: 45px;
            border-left: 4px solid #2ecc71;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <canvas id="c"></canvas>

    <div id="ui">
        <h2>3D 魔術方塊操作面板</h2>
        <div class="instr">1. 點擊「隨機打亂」將方塊打散。<br>2. 點擊「下一步還原」觀看逐步還原動畫。<br>3. 拖曳背景可旋轉 3D 視角。</div>
        
        <button id="btn-scramble" class="action-btn">🔀 隨機打亂方塊</button>
        <button id="btn-next-step" class="action-btn" disabled>▶️ 執行下一步還原</button>
        <button id="btn-reset" class="action-btn">🔄 重置方塊</button>
        
        <div id="step-log">狀態：請先點擊「隨機打亂方塊」。</div>
    </div>

    <!-- 載入 Three.js 與 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    const COLOURS = {
        'W': '#FFFFFF', // 白
        'Y': '#FFD700', // 黃
        'R': '#FF3B30', // 紅
        'O': '#FF9500', // 橙
        'B': '#007AFF', // 藍
        'G': '#34C759'  // 綠
    };

    let scene, camera, renderer, controls;
    let cubeObj = new THREE.Group();
    let isAnimating = false;
    let moveHistory = []; // 記錄打亂時的動作歷史

    document.getElementById('btn-scramble').addEventListener('click', scrambleCube);
    document.getElementById('btn-next-step').addEventListener('click', executeNextStep);
    document.getElementById('btn-reset').addEventListener('click', resetCube);

    function init() {
        const canvas = document.querySelector('#c');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3.5, 5.5);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        scene.add(cubeObj);
        createCube();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    // 建立標準 3x3x3 方塊
    function createCube() {
        while(cubeObj.children.length > 0){ 
            cubeObj.remove(cubeObj.children[0]); 
        }
        
        const geom = new THREE.BoxGeometry(0.95, 0.95, 0.95);
        const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const mats = [
                        blackMat.clone(), blackMat.clone(), // 右, 左
                        blackMat.clone(), blackMat.clone(), // 上, 下
                        blackMat.clone(), blackMat.clone()  // 前, 後
                    ];

                    if (x === 1) mats[0].color.set(COLOURS['R']);
                    if (x === -1) mats[1].color.set(COLOURS['O']);
                    if (y === 1) mats[2].color.set(COLOURS['W']);
                    if (y === -1) mats[3].color.set(COLOURS['Y']);
                    if (z === 1) mats[4].color.set(COLOURS['G']);
                    if (z === -1) mats[5].color.set(COLOURS['B']);

                    const mesh = new THREE.Mesh(geom, mats);
                    mesh.position.set(x, y, z);
                    cubeObj.add(mesh);
                }
            }
        }

        moveHistory = [];
        document.getElementById('step-log').innerText = "狀態：方塊已重置，請點擊「隨機打亂方塊」。";
        document.getElementById('btn-next-step').disabled = true;
    }

    function resetCube() {
        if (isAnimating) return;
        createCube();
    }

    // 單步旋轉動畫函數
    function rotateLayer(axis, layer, targetAngle) {
        return new Promise(resolve => {
            isAnimating = true;
            const pivot = new THREE.Group();
            
            if (axis === 'x') pivot.position.set(layer, 0, 0);
            if (axis === 'y') pivot.position.set(0, layer, 0);
            if (axis === 'z') pivot.position.set(0, 0, layer);
            
            scene.add(pivot);

            const targetCubies = cubeObj.children.filter(c => Math.abs(c.position[axis] - layer) < 0.1);
            targetCubies.forEach(c => pivot.attach(c));

            let currentAngle = 0;
            const frames = 15; // 動畫格數
            const angleStep = targetAngle / frames;

            function stepFrame() {
                if (Math.abs(currentAngle) < Math.abs(targetAngle)) {
                    pivot.rotation[axis] += angleStep;
                    currentAngle += angleStep;
                    requestAnimationFrame(stepFrame);
                } else {
                    pivot.rotation[axis] = targetAngle;
                    pivot.updateMatrixWorld();
                    
                    while(pivot.children.length > 0) {
                        const c = pivot.children[0];
                        cubeObj.attach(c);
                        c.position.x = Math.round(c.position.x);
                        c.position.y = Math.round(c.position.y);
                        c.position.z = Math.round(c.position.z);
                        c.rotation.x = Math.round(c.rotation.x / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.y = Math.round(c.rotation.y / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.z = Math.round(c.rotation.z / (Math.PI / 2)) * (Math.PI / 2);
                    }
                    
                    scene.remove(pivot);
                    isAnimating = false;
                    resolve();
                }
            }
            stepFrame();
        });
    }

    // 隨機打亂方塊（記錄動作歷史）
    async function scrambleCube() {
        if (isAnimating) return;
        createCube(); // 確保從乾淨狀態開始打亂

        const axes = ['x', 'y', 'z'];
        const layers = [-1, 1];
        const angles = [Math.PI / 2, -Math.PI / 2];
        const scrambleSteps = 6; // 打亂 6 步

        document.getElementById('btn-scramble').disabled = true;
        document.getElementById('btn-next-step').disabled = true;
        document.getElementById('step-log').innerText = "🔀 正在隨機打亂方塊...";

        for (let i = 0; i < scrambleSteps; i++) {
            const axis = axes[Math.floor(Math.random() * axes.length)];
            const layer = layers[Math.floor(Math.random() * layers.length)];
            const angle = angles[Math.floor(Math.random() * angles.length)];

            moveHistory.push({ axis, layer, angle }); // 記錄正向動作
            await rotateLayer(axis, layer, angle);
        }

        document.getElementById('step-log').innerText = `狀態：打亂完成！共 ${moveHistory.length} 步。請點擊「下一步還原」。`;
        document.getElementById('btn-scramble').disabled = false;
        document.getElementById('btn-next-step').disabled = false;
    }

    // 執行下一步還原（反向播放最後一個動作）
    async function executeNextStep() {
        if (isAnimating || moveHistory.length === 0) return;

        document.getElementById('btn-next-step').disabled = true;
        document.getElementById('btn-scramble').disabled = true;

        // 取出最後一個動作並「反向旋轉」
        const lastMove = moveHistory.pop();
        const reverseAngle = -lastMove.angle;

        const axisNames = { 'x': '右/左層', 'y': '上/下層', 'z': '前/後層' };
        document.getElementById('step-log').innerText = `⏳ 正在還原：反向旋轉 ${axisNames[lastMove.axis]}... (剩餘 ${moveHistory.length} 步)`;

        await rotateLayer(lastMove.axis, lastMove.layer, reverseAngle);

        if (moveHistory.length > 0) {
            document.getElementById('btn-next-step').disabled = false;
        } else {
            document.getElementById('step-log').innerText = "✨ 恭喜！方塊已完全還原！";
            document.getElementById('btn-next-step').disabled = true;
        }
        document.getElementById('btn-scramble').disabled = false;
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
