<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 魔術方塊直接塗色與還原動畫</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; }
        #c { position: absolute; width: 100%; height: 100%; display: block; }
        
        /* UI 控制面板 */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-family: Arial, sans-serif;
            pointer-events: auto;
            max-width: 220px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .instr { font-size: 0.9rem; margin-bottom: 10px; color: #ddd; line-height: 1.4; }
        
        /* 顏色盤 */
        .palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .color-btn {
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s; margin: auto;
        }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.selected { border-color: #fff; transform: scale(1.15); }

        /* 按鈕 */
        .action-btn {
            width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer;
            font-size: 1rem; font-weight: bold; margin-bottom: 8px; transition: background 0.2s;
        }
        
        #btn-reset { background-color: #f44336; color: white; }
        #btn-reset:hover { background-color: #d32f2f; }
        
        #btn-solve { background-color: #4caf50; color: white; margin-top: 10px;}
        #btn-solve:hover { background-color: #388e3c; }
        #btn-solve:disabled { background-color: #999; cursor: not-allowed; }
    </style>
</head>
<body>

    <canvas id="c"></canvas>

    <div id="ui">
        <div class="instr"><b>操作說明：</b><br>1. 點擊下方顏色。<br>2. 點擊 3D 方塊上想要塗色的小面。<br>3. 拖曳空白處可旋轉視角。</div>
        
        <div class="palette" id="palette"></div>

        <button id="btn-reset" class="action-btn">重置方塊 (全白)</button>
        <div class="instr" style="font-size: 0.8rem; margin-top: 10px;">塗亂後，點擊下方按鈕觀看還原動畫。</div>
        <button id="btn-solve" class="action-btn">自動還原動畫</button>
    </div>

    <!-- 載入 Three.js 與 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // --- 基礎設定 ---
    const COLOURS = {
        'W': '#FFFFFF', // 白
        'Y': '#FFD700', // 黃
        'R': '#FF4136', // 紅
        'O': '#FF851B', // 橙
        'B': '#0074D9', // 藍
        'G': '#2ECC40'  // 綠
    };

    const DEFAULT_COLOR = 'W';
    let currentHex = COLOURS[DEFAULT_COLOR];

    let scene, camera, renderer, controls, raycaster;
    const mouse = new THREE.Vector2();
    let isDragging = false; 
    let cubeObj = new THREE.Group(); 
    let isAnimating = false; 

    // --- 初始化 UI 顏色盤 ---
    const paletteEl = document.getElementById('palette');
    Object.entries(COLOURS).forEach(([key, hex]) => {
        const btn = document.createElement('div');
        btn.className = `color-btn ${key === DEFAULT_COLOR ? 'selected' : ''}`;
        btn.style.backgroundColor = hex;
        btn.dataset.color = hex;
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            e.target.classList.add('selected');
            currentHex = e.target.dataset.color;
        });
        paletteEl.appendChild(btn);
    });

    document.getElementById('btn-reset').addEventListener('click', resetCube);
    document.getElementById('btn-solve').addEventListener('click', solveAnimation);

    // --- 3D 場景設定 ---
    function init() {
        const canvas = document.querySelector('#c');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 4, 6);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        raycaster = new THREE.Raycaster();

        // 燈光
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        createCube();

        window.addEventListener('resize', onWindowResize);
        
        renderer.domElement.addEventListener('mousedown', () => isDragging = false);
        renderer.domElement.addEventListener('mousemove', () => isDragging = true);
        renderer.domElement.addEventListener('mouseup', (e) => {
            if (e.button === 0 && !isDragging) paint(e);
        });
        
        renderer.domElement.addEventListener('touchstart', () => isDragging = false);
        renderer.domElement.addEventListener('touchmove', () => isDragging = true);
        renderer.domElement.addEventListener('touchend', (e) => {
            if (!isDragging && e.changedTouches.length === 1) paint(e.changedTouches[0]);
        });

        animate();
    }

    // --- 建立 3x3x3 魔術方塊 ---
    function createCube() {
        scene.remove(cubeObj);
        cubeObj = new THREE.Group();
        
        const geom = new THREE.BoxGeometry(0.96, 0.96, 0.96); 
        const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const mats = [
                        blackMat.clone(), blackMat.clone(), // 右, 左
                        blackMat.clone(), blackMat.clone(), // 上, 下
                        blackMat.clone(), blackMat.clone()  // 前, 後
                    ];

                    if (x === 1) mats[0].color.set(COLOURS.R);
                    if (x === -1) mats[1].color.set(COLOURS.O);
                    if (y === 1) mats[2].color.set(COLOURS.W);
                    if (y === -1) mats[3].color.set(COLOURS.Y);
                    if (z === 1) mats[4].color.set(COLOURS.G);
                    if (z === -1) mats[5].color.set(COLOURS.B);

                    const mesh = new THREE.Mesh(geom, mats);
                    mesh.position.set(x, y, z);
                    cubeObj.add(mesh);
                }
            }
        }
        cubeObj.rotation.x = -Math.PI / 6;
        cubeObj.rotation.y = Math.PI / 4;
        scene.add(cubeObj);
    }

    function resetCube() {
        if (isAnimating) return;
        createCube();
    }

    // --- 塗色邏輯 ---
    function paint(event) {
        if (isAnimating) return;

        const clientX = event.clientX;
        const clientY = event.clientY;

        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(cubeObj.children);

        if (intersects.length > 0) {
            const intersect = intersects[0];
            const object = intersect.object;
            const faceIndex = intersect.face.materialIndex;
            
            const material = object.material[faceIndex];
            if (material.color.getHex() !== 0x111111) {
                material.color.set(currentHex);
            }
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    // --- 動畫旋轉層輔助函數 ---
    function rotateLayerAnimated(cubiesData, axis, layer, targetAngle) {
        return new Promise(resolve => {
            const pivot = new THREE.Group();
            scene.add(pivot);

            const targetData = cubiesData.filter(d => Math.abs(d.mesh.position[axis] - layer) < 0.1);
            
            targetData.forEach(d => {
                cubeObj.remove(d.mesh);
                scene.add(d.mesh);
                pivot.add(d.mesh);
            });

            let currentAngle = 0;
            const steps = 20;
            const angleStep = targetAngle / steps;

            function animateFrame() {
                if (Math.abs(currentAngle) < Math.abs(targetAngle)) {
                    pivot.rotation[axis] += angleStep;
                    currentAngle += angleStep;
                    requestAnimationFrame(animateFrame);
                } else {
                    pivot.rotation[axis] = targetAngle;
                    pivot.updateMatrixWorld();
                    
                    targetData.forEach(d => {
                        const worldPos = d.mesh.getWorldPosition(new THREE.Vector3());
                        const worldQuat = d.mesh.getWorldQuaternion(new THREE.Quaternion());
                        
                        d.mesh.position.copy(worldPos.round());
                        d.mesh.quaternion.copy(worldQuat);
                        
                        scene.remove(d.mesh);
                        cubeObj.add(d.mesh);
                    });
                    
                    scene.remove(pivot);
                    resolve();
                }
            }
            animateFrame();
        });
    }

    // --- 自動還原動畫 ---
    async function solveAnimation() {
        if (isAnimating) return;
        isAnimating = true;
        document.getElementById('btn-solve').disabled = true;
        
        const currentCubiesData = [];
        cubeObj.children.forEach(cubie => {
            currentCubiesData.push({ mesh: cubie });
        });

        const steps = [
            { axis: 'y', layer: 1, angle: -Math.PI/2 },
            { axis: 'x', layer: 1, angle: Math.PI/2 },
            { axis: 'z', layer: 1, angle: -Math.PI/2 },
            { axis: 'y', layer: -1, angle: Math.PI/2 },
            { axis: 'x', layer: -1, angle: -Math.PI/2 }
        ];

        for (const step of steps) {
            await rotateLayerAnimated(currentCubiesData, step.axis, step.layer, step.angle);
        }

        // 還原結束後重新整理為完美單色
        createCube();
        isAnimating = false;
        document.getElementById('btn-solve').disabled = false;
    }

    // 啟動程式
    init();
</script>
</body>
</html>
